# Proposed configuration (paper Table 3). Development run: trains on the
# 1,001 development-training subjects and selects the checkpoint and the
# decision threshold on the 250 validation subjects. Ablations inherit from
# this file and change one setting at a time.

data:
  data_dir: data/processed
  splits_dir: splits
  train_split: dev_train
  val_split: val

model:
  arch: decoder_free          # decoder_free | encoder_decoder
  in_channels: 12             # 3 adjacent axial slices x 4 sequences
  n_classes: 3                # WT, TC, ET (independent sigmoids)
  widths: [32, 64, 128]
  aspp_rates: [6, 12]         # plus the 1x1 branch -> dilation rates {1, 6, 12}

training:
  seed: 2026
  epochs: 10
  batch_size: 32
  lr: 3.0e-4                  # Adam (0.9, 0.999)
  scheduler_step: epoch       # cosine annealing over the full run, stepped once per epoch
  amp: true                   # FP16 mixed precision
  num_workers: 4
  rho: 0.25                   # tumour-free share of the balanced training corpus
  sampling_seed: 2021
  augment: false

loss:
  w_dice: 0.5
  w_bce: 0.3
  w_focal: 0.2
  pos_weight: 2.0
  focal_alpha: 0.8
  focal_gamma: 2.0
  head_weights: [1.0, 0.3, 0.2]   # P3 / P2 / P1

validation:
  thresholds: [0.3, 0.4, 0.5, 0.6]
  per_region_threshold: false
  batch_slices: 64
